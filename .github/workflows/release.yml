name: Artefatos de homologação e release
on:
  push:
    branches: ['homolog']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag correspondente à versão em Directory.Build.props (deixe vazio para pacote de homologação)'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore SonarFrame.slnx --locked-mode
      - name: Testar e empacotar distribuição
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.version_tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:INPUT_TAG) {
              ./release.ps1 -ExpectedTag $env:INPUT_TAG
          } elseif ($env:REF_TYPE -eq 'tag') {
              ./release.ps1 -ExpectedTag $env:REF_NAME
          } else {
              ./release.ps1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ (github.ref_type == 'tag' || github.event.inputs.version_tag != '') && 'sonarframe-release' || 'sonarframe-homolog' }}
          include-hidden-files: true
          path: |
            .tools/releases/**/*.zip
            .tools/releases/**/*.nupkg
            .tools/releases/**/SHA256SUMS.txt
            .tools/releases/**/CHANGELOG.md
            .tools/releases/**/release.md

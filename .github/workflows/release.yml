name: Artefatos de release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag correspondente à versão em Directory.Build.props'
        required: true
        default: 'v0.1.0'
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore SonarFrame.slnx --locked-mode
      - name: Testar e empacotar a versão correspondente
        shell: pwsh
        env:
          EXPECTED_TAG: ${{ github.event.inputs.version_tag || github.ref_name }}
        run: ./release.ps1 -ExpectedTag $env:EXPECTED_TAG
      - uses: actions/upload-artifact@v4
        with:
          name: sonarframe-release
          path: |
            artifacts/releases/**/*.zip
            artifacts/releases/**/*.nupkg
            artifacts/releases/**/SHA256SUMS.txt
            artifacts/releases/**/CHANGELOG.md
            artifacts/releases/**/release.md

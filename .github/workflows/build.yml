name: Core
on:
  push:
    branches:
      - main
      - homolog
      - develop
      - 'feat/**'
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
      - homolog
      - develop
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore SonarFrame.slnx --locked-mode
      - run: ./setup-media.ps1
      - run: ./build.ps1 -Pack
      - uses: actions/upload-artifact@v4
        with:
          name: sonarframe-packages
          include-hidden-files: true
          path: .tools/packages/*.nupkg
